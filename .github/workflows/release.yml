name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS artifacts
        run: make ios VERSION=${{ env.VERSION }}

      - name: Extract release notes from CHANGELOG.md
        run: awk -v tag="${{ env.VERSION }}" '/^## \[/{f = ($0 ~ "^## \\[" tag "\\]")} f' CHANGELOG.md > release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            ios/Playground-${{ env.VERSION }}.zip
            ios/Playground-${{ env.VERSION }}.ipa

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: make android VERSION=${{ env.VERSION }}

      - name: Extract release notes from CHANGELOG.md
        run: awk -v tag="${{ env.VERSION }}" '/^## \[/{f = ($0 ~ "^## \\[" tag "\\]")} f' CHANGELOG.md > release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: android/Playground-${{ env.VERSION }}.apk
